name: ClassPass
kind: company
description: ClassPass is a fitness and wellness marketplace that lets consumers
  book classes, gym visits, and spa/wellness experiences across a network of
  studios in a single app using a monthly credit subscription. On the supply
  side, ClassPass runs a partner integration platform - centered on a named
  "ClassPass Inventory API" - that lets studios and their scheduling/booking
  software (100+ platforms, including Mindbody, Vagaro, Zen Planner, and
  Eversports Manager) push live class schedules, availability, and pricing to
  ClassPass and receive bookings and cancellations back. The partner developer
  portal at developers.classpass.com requires an approved partner login
  (Auth0) to view the API specification document and run certification tests;
  ClassPass does not publish a public, unauthenticated API reference,
  OpenAPI file, or Postman collection. ClassPass is now part of Playlist, the
  group formed together with Mindbody and Booker.
