- aid: classpass:classpass-inventory-api
  name: ClassPass Inventory API
  tags:
  - Inventory
  - Classes
  - Schedules
  - Availability
  - Bookings
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.classpass.com/specInfo
  properties:
  - url: https://developers.classpass.com/
    type: Documentation
  - url: https://developers.classpass.com/specInfo
    type: APIReference
  description: ClassPass's named partner integration API for studios and their
    scheduling/booking software. Per ClassPass partner-marketing pages and
    integration-partner help centers (e.g. studio scheduling vendors that
    consume this API), studios push class schedules, real-time availability,
    and pricing to ClassPass, and receive bookings and cancellations back -
    on some partner platforms reconciled on a roughly 30-minute polling
    interval. ClassPass's own reference for this API - the "ClassPass
    Inventory API" specification document titled on
    developers.classpass.com/specInfo - sits behind an Auth0-gated partner
    login; endpoint paths, request/response payloads, and versioning are not
    published for unauthenticated readers, so no endpoint list is modeled
    here.
  endpointsModeled: false
- aid: classpass:classpass-partner-certification-portal
  name: ClassPass Partner Certification & Token Portal
  tags:
  - Partner Portal
  - OAuth
  - Certification
  - Sandbox
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developers.classpass.com/
  properties:
  - url: https://developers.classpass.com/
    type: Documentation
  description: The client-side application shell served at
    developers.classpass.com (inspectable without authenticating) declares
    Redux state entities named cpToken, integratorSettings, specDoc,
    validationTests, and runTest, indicating the portal issues partner API
    tokens, stores per-integrator settings, serves the gated API
    specification document, and runs an automated validation/certification
    test suite that integrations must pass before going live. Login is
    handled via Auth0 (core-portal.auth0.com, audience
    https://developers.classpass.com). No further technical detail - scopes,
    token format, or test coverage - is publicly visible without an approved
    partner account.
  endpointsModeled: false
